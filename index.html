--serif:"Cormorant Garamond",Georgia,serif;--didone:"Bodoni Moda",Didot,Georgia,serif;--script:"Pinyon Script","Snell Roundhand",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surround:#1a080c}}
:root[data-theme="dark"]{--surround:#1a080c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--surround);font-family:var(--serif);color:var(--ink);-webkit-text-size-adjust:100%}
.card{position:relative;max-width:460px;margin:0 auto;overflow:hidden;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:radial-gradient(120% 80% at 50% 45%,var(--paper1),var(--paper2))}
.card::after{content:"";position:absolute;inset:18px;border:1px solid var(--ink);opacity:.8;pointer-events:none}
.rose{position:absolute;top:0;left:0;width:78%;aspect-ratio:560/512;background:var(--rose) no-repeat center/contain;pointer-events:none}
.rose.br{top:auto;left:auto;bottom:0;right:0;width:62%;transform:rotate(180deg); mix-blend-mode: multiply; z-index: 1;}
.in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(190px,58vw,270px) 34px 70px}
.in>*{animation:up .9s both;animation-delay:calc(.16s*var(--i,0))}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.eb{margin:0;font-size:14px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.rule{width:72%;height:1.5px;background:var(--ink);margin:18px 0}
.n18{font-family: 'Gestura Text TRIAL', sans-serif;font-size:90px;line-height:1;margin:0;position:relative;font-weight:300}
.n18 span{ font-family: 'Brittany Signature', sans-serif;font-size:36px;position:absolute;top:6px;right:-34px}
.bd,.nm{font-family:var(--script);margin:0;font-weight:400;line-height:1.05}
.bd{font-size:56px;margin-top:-4px}.nm{font-size:68px;margin-top:-6px}
.date{margin:20px 0 0;font-size:19px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;padding-left:.3em}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:300px}
.cd div{border-top:1px solid var(--ink);padding-top:8px}
.num{display:block;font-family:var(--didone);font-size:30px;line-height:1}
.lab{font-size:12px;font-weight:600;letter-spacing:.14em}
.row{display:flex;align-items:center;gap:14px;margin:0 0 18px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1.5; max-width: 85%;}
.row svg{flex:none;width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.6}
.row i{width:1px;align-self:stretch;background:var(--ink)}
.row a{color:inherit;text-decoration:none;border-bottom:1px solid var(--ink)}
.btn{display:block;width:min(100%,320px);min-height:50px;border:0;border-radius:12px;background:var(--wine);color:var(--cream);font:600 14px var(--serif);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.cal{display:inline-block;margin-top:16px;padding:10px;color:var(--ink);font-size:17px;font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ov{position:fixed;inset:0;background:rgba(26,8,12,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;z-index:6;background:var(--paper1);color:var(--ink);border-radius:22px 22px 0 0;padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:center}
.sheet.on{transform:none}
.sheet h2{font:400 44px var(--script);margin:0 0 14px}
.sheet p{margin:8px 0 14px;font-size:18px}
#nm{width:100%;padding:14px;font:500 19px var(--serif);color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:10px}
#nm::placeholder{color:var(--ink);opacity:.55}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.seg button{min-height:48px;border:1px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:600 17px var(--serif);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--cream)}
.sheet .btn{margin:0 auto}
#wa{color:var(--ink);font-weight:600}
.pt{position:fixed;top:-12vh;width:var(--s);pointer-events:none;z-index:7;animation:fall var(--d) linear both}
@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.in>*{animation:none}.sheet,.ov{transition:none}}
</style>
</head>

const $=s=>document.querySelector(s);
function petals(n){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 for(let i=0;i<n;i++){
  const p=new Image();p.src=PETAL;p.alt="";p.className="pt";

 }

 const t=Math.max(0,target-Date.now())/1000|0;
 const v=[t/86400|0,t%86400/3600|0,t%3600/60|0,t%60];
 document.querySelectorAll(".num").forEach((e,i)=>e.textContent=String(v[i]).padStart(2,"0"));
}
tick();setInterval(tick,1000);setTimeout(()=>petals(14),700);
